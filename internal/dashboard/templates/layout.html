{{define "layout"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conflux Dashboard</title>
  <link rel="stylesheet" href="/_dashboard/assets/dashboard.css">
  <script src="/_dashboard/assets/htmx.min.js" defer></script>
  <script src="/_dashboard/assets/dashboard.js" defer></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <h1>{{svg "logo"}} Conflux</h1>
        <div class="ver">gateway v{{.Version}}</div>
      </div>
      <nav class="nav">
        {{$active := .Active}}
        {{range .Nav}}
        <a href="/_dashboard/{{.Path}}" class="{{if eq .Path $active}}active{{end}}">{{svg .Icon}} <span>{{.Label}}</span></a>
        {{end}}
      </nav>
      <div class="sidebar-footer">
        <div class="live-toggle" id="live-toggle-btn" role="button" tabindex="0" title="Toggle Live Mode (2s auto-refresh)">
          <div class="live-status">
            <span class="live-dot" id="live-indicator"></span>
            <span class="live-text">Live Mode <span class="live-badge">2s</span></span>
          </div>
          <label class="switch" onclick="event.stopPropagation()" title="Toggle 2s Live Mode">
            <input type="checkbox" id="live-mode-toggle" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </aside>
    <main class="main" id="main-region" data-section="{{if .Active}}{{.Active}}{{else}}overview{{end}}">
      {{.Body}}
    </main>
  </div>
</body>
</html>
{{end}}
