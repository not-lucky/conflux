# Conflux v3.0 sample configuration.
# See docs/functional-spec.md §4 for the full schema.
# Providers are a MAP keyed by provider name (spec §4.1).

server:
  port: 24118
  request_timeout: 60s
  stream_idle_timeout: 15s
  stream_keepalive_interval: 15s
  request_deadline: 180s
  expose_diagnostics: true
  admin_token: "admin-secret-change-me"

auth:
  client_keys:
    - "sk-conflux-global-001"
    - "sk-conflux-global-002"

logging:
  level: full
  max_dirs: 1000

proxies:
  # Global egress pool (optional). Empty urls means direct. Omit
  # rotate_interval for sticky pinning (no rotation).
  urls: []
  max_errors: 5
  cooldown: 5m

defaults:
  key_selection:
    mode: round_robin
    requests_per_key: 1
  max_errors: 5
  cooldown: 5h
  retire_on_exhaustion: false
  max_stream_retries: 3
  upstream_5xx_threshold: 5
  upstream_5xx_cooldown: 30s
  request_timeout: 60s
  stream_idle_timeout: 15s
  stream_keepalive_interval: 15s
  request_deadline: 180s

providers:
  openai:
    base_url: "https://api.openai.com/v1"
    keys:
      - key: "sk-openai-000000000000000000000000000000000000000000000001"
      - key: "sk-openai-000000000000000000000000000000000000000000000002"
        proxy: "http://proxy-a:8080"
    models:
      - gpt-4o
      - gpt-4o-mini
      - gpt-4*
    max_errors: 5
    cooldown: 5h
    retire_on_exhaustion: false
    max_stream_retries: 3
    upstream_5xx_threshold: 5
    upstream_5xx_cooldown: 30s
    request_timeout: 60s
    stream_idle_timeout: 15s
    stream_keepalive_interval: 15s
    request_deadline: 180s
    key_selection:
      mode: round_robin
      requests_per_key: 1

  anthropic:
    base_url: "https://api.anthropic.com/v1"
    keys:
      - key: "sk-ant-000000000000000000000000000000000000000000000001"
    models:
      - claude-3-5-sonnet
      - claude-3*
    max_errors: 5
    cooldown: 5h
    retire_on_exhaustion: false
    max_stream_retries: 3
    upstream_5xx_threshold: 5
    upstream_5xx_cooldown: 30s
    key_selection:
      mode: round_robin
      requests_per_key: 1
    fallback_models:
      claude-3-5-sonnet: claude-3-5-haiku

  catchall:
    base_url: "https://fallback.example.com/v1"
    keys:
      - key: "sk-fallback-000000000000000000000000000000000000000000001"
    models:
      - "*"

persistence:
  path: "./state.yaml"
